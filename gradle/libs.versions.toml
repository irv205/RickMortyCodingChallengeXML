[versions]
agp = "9.1.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.13.0"
constraintlayout = "2.1.4"
retrofit = "2.11.0"
moshi = "1.15.2"
okhttp = "4.12.0"
glide = "4.16.0"
lifecycleKtx = "2.8.5"
activityKtx = "1.9.2"
fragmentKtx = "1.8.3"
hilt = "2.60.1"
ksp = "2.3.10"
navigationFragmentKtx = "2.10.1"
navigationUiKtx = "2.10.1"
room = "2.7.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Core Retrofit
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

# Convertidor JSON
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
# Moshi Kotlin (KotlinJsonAdapterFactory para clases Kotlin sin adapter generado)
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }

# OkHttp Cliente y Logging Interceptor (útil para depurar las peticiones en el challenge)
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Glide Core
glide-core = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
# Procesador KSP de Glide (para registrar @GlideModule)
glide-ksp = { group = "com.github.bumptech.glide", name = "ksp", version.ref = "glide" }

# KTX
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Navigation: carga y gestiona fragments mediante un grafo (res/navigation/main_graph.xml)
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }

# Room: base de datos local (SQLite) para modo offline.
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Room + Coroutines: permite DAOs suspend y entidades observables.
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# Procesador KSP de Room: genera el código de la base de datos en compilación.
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[bundles]
retrofit = ["retrofit-core", "retrofit-converter-moshi", "okhttp-core", "okhttp-logging", "moshi-kotlin"]
ktx = [
    "androidx-core-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-runtime-ktx",
    "androidx-activity-ktx",
    "androidx-fragment-ktx"
]
# Room en runtime (room-compiler queda aparte porque se aplica con ksp(), no con implementation()).
room = ["room-runtime", "room-ktx"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

